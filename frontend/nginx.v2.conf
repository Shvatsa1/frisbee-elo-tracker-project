# nginx for the v2 site on :8080 (runs ALONGSIDE the live v1 on :80).
# Serves the built SPA and proxies /api to the v2 backend so the frontend can
# use a relative API base (VITE_API_BASE=/api) — same bundle works in dev + prod.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API → v2 backend container. No trailing slash on proxy_pass so the /api
  # prefix is preserved (backend routes are /api/*).
  location /api/ {
    proxy_pass http://backend-v2:5000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA client-side routing fallback (so /v2/leaderboard, /r/:token resolve).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
