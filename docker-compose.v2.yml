# UltiElo v2 stack on :8080 — runs ALONGSIDE the live v1 (untouched on :80).
#
# RAM WARNING: the VM is 1 GB, shared with the consultant-bot + the 7pm IST
# trading-bot task. This self-contained variant adds a 2nd Postgres (~200 MB)
# and is the heavy option. Add a swapfile FIRST (see DEPLOY_V2.md), and prefer
# the lean variant (reuse the v1 Postgres, just add a `frisbee_elo_v2` database)
# documented in the runbook if RAM is tight. mem_limits below are a safety cap.
#
# Bring up:   docker compose -f docker-compose.v2.yml up -d --build
# Tear down:  docker compose -f docker-compose.v2.yml down        (v1 untouched)
services:
  db-v2:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: frisbee_elo_v2
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped

  backend-v2:
    build: ./backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:password@db-v2:5432/frisbee_elo_v2
      # Peer rating stays gated until HTTPS; /api/rate is governed by
      # context.open_rating instead (see SPEC_16).
      - ENABLE_PEER_RATING=0
    depends_on:
      - db-v2
    mem_limit: 192m
    restart: unless-stopped

  frontend-v2:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: /api
    ports:
      - "8080:8080"        # public entry: http://159.89.160.51:8080
    depends_on:
      - backend-v2
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata_v2:
